[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "wildfireguardian-osse"
version = "0.1.0"
description = "Observing System Simulation Experiment laboratory for WildfireGuardian: synthetic wildfire worlds and controlled imperfect observations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
figures = ["matplotlib>=3.6"]

[project.scripts]
wg-osse = "wildfireguardian_osse.cli.main:main"
wg-fv = "wildfireguardian_fv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]
